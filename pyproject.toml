[project]
name = "rcvd-pycameraserver-modern"
version = "0.1.0"
description = "Modern Python 3.12 clone of PyCameraServer UI and render controls."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Flask>=3.1.1",
  "Werkzeug>=3.1.3",
  "numpy>=2.2,<2.3",
  "opencv-contrib-python>=4.12.0.88",
  "Pillow>=11.3.0",
  "psutil>=7.0.0",
  "scikit-learn>=1.7.1",
  "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]
ai = [
  "basicsr>=1.4.2",
  "facexlib>=0.3.0",
  "gfpgan>=1.3.8",
  "realesrgan>=0.3.0",
  "spandrel>=0.4.1",
  "tqdm>=4.67.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
