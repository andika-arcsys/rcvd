<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0B131B}</style>
</helmet>
<div style="min-height: 900px; background: #0B131B; color: #E6EDF3; font-family: 'IBM Plex Sans', sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
  <form style="width: 100%; max-width: 420px; background: #101B25; border: 1px solid #22313F; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
    <div style="font-size: 26px; font-weight: 600">Masuk</div>
    <div style="font-size: 14px; color: #93A4B5">Gunakan akun Pertamina (SSO) atau PIN lapangan.</div>
    <a href="Peran.dc.html" style="text-align: center; text-decoration: none; background: #E6EDF3; color: #0B131B; border-radius: 10px; padding: 14px; font-weight: 600">Masuk dengan SSO</a>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #93A4B5"><span style="flex: 1; border-top: 1px solid #22313F"></span>atau PIN lapangan<span style="flex: 1; border-top: 1px solid #22313F"></span></div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px">ID pengguna
      <input type="text" placeholder="contoh: andika.pratama" style="background: #0B131B; color: #E6EDF3; border: 1px solid #2A3A4B; border-radius: 8px; padding: 12px; font-size: 14px; font-family: inherit">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px">PIN (6 digit)
      <input type="password" placeholder="••••••" style="background: #0B131B; color: #E6EDF3; border: 1px solid #2A3A4B; border-radius: 8px; padding: 12px; font-size: 14px; font-family: 'IBM Plex Mono', monospace">
    </label>
    <a href="Peran.dc.html" style="text-align: center; text-decoration: none; background: #F28C28; color: #1A0F02; border-radius: 10px; padding: 14px; font-weight: 600">Masuk</a>
    <div style="font-size: 12px; color: #93A4B5; line-height: 1.6">Setelah beberapa kali gagal, akun dikunci sementara dan kejadian dicatat di audit log.</div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
