<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Gallery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0B131B}a{color:#7CC4F0}.st-ok{color:#9FE0BE}.st-warn{color:#F2D27A}</style>
</helmet>
<div style="min-height: 900px; background: #0B131B; color: #E6EDF3; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-wrap: wrap">
  <dc-import name="Nav" active="Gallery" hint-size="220px,900px"></dc-import>
  <main style="flex: 999 1 640px; min-width: 0; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
      <div><div style="font-size: 13px; color: #93A4B5">Misi Sinorang River Crossing</div><h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 600">Gallery snapshot</h1></div>
      <div style="margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap">
        <a href="Span.dc.html" style="text-decoration: none; background: #F28C28; color: #1A0F02; border-radius: 10px; padding: 14px 20px; font-weight: 600">Hitung span</a>
        <a href="Arsip.dc.html" style="text-decoration: none; color: #E6EDF3; border: 1px solid #2A3A4B; border-radius: 10px; padding: 14px 20px">Ekspor paket</a>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px">
      <select style="background: #101B25; color: #E6EDF3; border: 1px solid #2A3A4B; border-radius: 8px; padding: 10px; font-family: inherit"><option>Pipa: 16"</option></select>
      <select style="background: #101B25; color: #E6EDF3; border: 1px solid #2A3A4B; border-radius: 8px; padding: 10px; font-family: inherit"><option>Segmen: semua</option></select>
      <select style="background: #101B25; color: #E6EDF3; border: 1px solid #2A3A4B; border-radius: 8px; padding: 10px; font-family: inherit"><option>Kalibrasi: VALID + ESTIMATE_ONLY</option></select>
      <select style="background: #101B25; color: #E6EDF3; border: 1px solid #2A3A4B; border-radius: 8px; padding: 10px; font-family: inherit"><option>Kelas temuan: semua</option></select>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 16px; flex: 1">
      <div style="flex: 999 1 520px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-content: start">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="8">
          <button style="text-align: left; background: #101B25; border: 1px solid #22313F; color: #E6EDF3; border-radius: 10px; padding: 8px; font-family: inherit; display: flex; flex-direction: column; gap: 6px">
            <span style="display: block; height: 90px; border-radius: 6px; background: #123640; position: relative"><span style="position: absolute; left: 0; right: 0; top: 40px; height: 22px; background: #55636B; border-radius: 11px"></span></span>
            <b style="font-size: 13px; font-family: 'IBM Plex Mono', monospace">{{c.seg}} · freeze {{c.f}}</b>
            <span class="{{c.color}}" style="font-size: 12px">{{c.status}}</span>
          </button>
        </sc-for>
      </div>
      <aside style="flex: 1 1 300px; background: #101B25; border: 1px solid #22313F; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; font-size: 13px">
        <b style="font-size: 15px">Detail · S1 freeze 1</b>
        <div style="height: 150px; border-radius: 8px; background: #123640; position: relative"><span style="position: absolute; left: 0; right: 0; top: 64px; height: 30px; background: #55636B; border-radius: 15px"></span></div>
        <div style="display: flex; justify-content: space-between"><span style="color: #93A4B5">Ukuran</span><b style="font-family: 'IBM Plex Mono', monospace">[x,xx] m ± [x,x] cm</b></div>
        <div style="display: flex; justify-content: space-between"><span style="color: #93A4B5">Kalibrasi</span><b style="color: #9FE0BE">VALID</b></div>
        <div style="display: flex; justify-content: space-between"><span style="color: #93A4B5">Diambil</span><b>[waktu] · [operator]</b></div>
        <details style="background: #0B131B; border-radius: 8px; padding: 10px"><summary>Metadata JSON</summary><pre style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; white-space: pre-wrap; margin: 8px 0 0">{ "frame": "[ID]", "scale_mm_px": "[x]", "points": [...] }</pre></details>
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
          <a href="Review.dc.html" style="text-align: center; text-decoration: none; color: #E6EDF3; border: 1px solid #2A3A4B; border-radius: 10px; padding: 12px">Kirim ke Review</a>
          <a href="CanvasAnotasi.dc.html" style="text-align: center; text-decoration: none; color: #E6EDF3; border: 1px solid #2A3A4B; border-radius: 10px; padding: 12px">Buka di Canvas</a>
        </div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  const ok = 'st-ok', warn = 'st-warn';
  const cards = [['S1',1,'VALID · lolos',ok],['S1',2,'VALID · lolos',ok],['S2',1,'VALID · lolos',ok],['S2',2,'VALID · lolos',ok],['S3',1,'Selisih >5 cm',warn],['S3',2,'Selisih >5 cm',warn],['S4',1,'ESTIMATE_ONLY',warn],['S4',2,'VALID · lolos',ok]];
  return { cards: cards.map(([seg, f, status, color]) => ({ seg, f, status, color })) };
}
}
</script>
</body>
</html>
