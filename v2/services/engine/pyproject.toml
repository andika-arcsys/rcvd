[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepinsight-engine"
version = "0.1.0"
description = "Engine lokal DeepInsight: video, AI, pengukuran, penyimpanan"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12"]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-psutil",
]

[tool.setuptools.packages.find]
include = ["deepinsight_engine*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["deepinsight_engine", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with:Warning"]
