  sustainability: {ketua_tim: full, pilot_drone: view, ahli_ukur: view, pengelola_data: view, teknisi_program: view, pemeriksa_teknik: full, manajemen: view}
  arsip:          {ketua_tim: full, pilot_drone: view, ahli_ukur: view, pengelola_data: full, teknisi_program: view, pemeriksa_teknik: full, manajemen: view}
