# Templat kalibrasi kamera. Nama berkas diawali garis bawah, jadi tidak muncul sebagai kamera.
# Salin menjadi config/cameras/<id>.yaml lewat scripts/calibrate_camera.py.
# Jangan mengisi angka di berkas ini dengan tangan.
# RMS <= camera.rms_good_px diterima. Sampai camera.rms_max_px diterima
# dengan peringatan. Di atas rms_max_px, skrip menolak menulis hasil.
schema_version: 1
id: _template
square_mm: null
image_width: null
image_height: null
corners_cols: null
corners_rows: null
camera_matrix: null
dist_coeffs: null
rms: null
calibrated_at: null
