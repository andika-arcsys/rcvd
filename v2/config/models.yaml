# Lokasi berkas model, relatif terhadap folder models/ (app.yaml models.dir).
# Berkas .onnx dan .pt tidak di-commit (sering di atas batas 100 MB GitHub).
schema_version: 1

entries:
  aquaclear:
    requires_gpu: false
  hydrodetect:
    # Bobot pelatihan Ultralytics. Dipakai lebih dulu bila berkasnya ada.
    weights: hydrodetect/exp5/model.pt
    onnx: hydrodetect/exp5/model.onnx
    classes: hydrodetect/exp5/classes.json
    metadata: hydrodetect/exp5/metadata.json
    requires_gpu: true
  # Live memakai Depth Anything 3 (Hugging Face), bukan berkas di folder ini.
  # depth_pro.pt dan model.onnx hanya untuk backend depth_pro di spatialsight.yaml.
  spatialsight:
    checkpoint: spatialsight/depth_pro.pt
    onnx: spatialsight/model.onnx
    requires_gpu: true
