# Templat pipa. Diameter hanya "16" atau "8". Batas kritis dihitung dari thresholds.yaml.
# D-20 belum diisi tim. Entri "contoh" hanya agar layar misi dapat diuji.
# Bukan data lapangan: tidak ada KP, tidak ada OD, bukan pipa Sinorang.
# Daftar kosong (pipelines: []) tetap membuat engine menyala. Layar misi tidak punya pipa
# sampai baris diisi. Jangan menambah diameter lain sebelum skema diubah.
schema_version: 1
pipelines:
  - id: contoh
    name: "Contoh (bukan data lapangan)"
    diameter: "16"
